<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101611" />
  <title>Mythvale — Crown of the Wilds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-CKTRnPDl.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DGDd-ukA.css">
</head>
<body>
  <div id="game">
    <canvas id="world"></canvas>
    <div class="vignette"></div>
    <header class="topbar">
      <div class="brand"><div class="crest">♜</div><div><div class="brand-name">MYTHVALE</div><div class="brand-sub">CROWN OF THE WILDS</div></div></div>
      <div class="day-pill"><span class="sun">☼</span><span id="dayLabel">DAY 1</span><i></i><span id="seasonLabel">EARLY SUMMER</span></div>
      <div class="resources">
        <div class="resource"><span class="res-icon gold">✦</span><span id="goldCount">650</span><small>GOLD</small></div>
        <div class="resource"><span class="res-icon wood">♠</span><span id="woodCount">8</span><small>WOOD</small></div>
        <div class="resource"><span class="res-icon crystal">◆</span><span id="crystalCount">3</span><small>CRYSTAL</small></div>
      </div>
      <button id="endTurn" class="end-turn"><span>END TURN</span><b>↗</b></button>
    </header>
    <div class="map-title"><div class="eyebrow">THE KINGDOM OF</div><h1>Mythvale</h1><div class="title-rule"><span></span>✦<span></span></div></div>
    <div class="hero-card glass"><div class="hero-avatar"><div class="avatar-crown">♛</div><div class="avatar-face">♟</div></div><div class="hero-copy"><div class="hero-label">YOUR HERO</div><strong>Sir Aldric</strong><div class="hero-stats"><span>⚔ <b id="armyCount">12</b></span><span>✧ <b>3</b></span><span class="moves"><span id="movesCount">5</span> MOVES</span></div></div><div class="level">I</div></div>
    <div class="objective glass"><span class="obj-mark">✦</span><div><small>YOUR QUEST</small><strong id="questText">Clear the bandit camp</strong><p id="questSub">The road east is not safe.</p></div></div>
    <div class="map-controls"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="homeView" aria-label="Center map">⌂</button></div>
    <div class="bottom-hint"><span class="hint-key">CLICK</span> to move <span class="hint-dot">·</span><span class="hint-key">CLICK</span> a landmark to interact</div>
    <div id="toast" class="toast"></div>
    <div id="modalRoot"></div>
    <div class="corner-stamp">✦ &nbsp; DAY OF THE CROWN &nbsp; ✦</div>
  </div>
</body>
</html>
